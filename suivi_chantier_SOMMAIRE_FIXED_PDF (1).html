
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Chantier - PRO SOMMAIRE CORRIGÉ</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f5f6fa; --dark: #1e272e; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: #2f3640; overflow: hidden; }
        
        /* Navigation Onglets */
        .tabs-header { display: flex; overflow-x: auto; background: var(--primary); padding: 10px 5px 0; border-bottom: 4px solid var(--accent); flex-shrink: 0; }
        .tab-wrapper { position: relative; display: flex; align-items: center; margin-right: 2px; }
        .tab-btn { padding: 12px 35px 12px 15px; background: #34495e; color: white; border: none; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; min-width: 80px; }
        .tab-btn.active { background: var(--accent); font-weight: bold; }
        .tab-btn.intro-tab { background: #d35400; }
        .tab-btn.intro-tab.active { background: #e67e22; }
        .edit-tab { position: absolute; right: 8px; cursor: pointer; font-size: 10px; color: white; }

        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        
        .left-panel { flex: 0 0 320px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day { aspect-ratio: 1; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 0.85em; }
        .day.selected { background: var(--accent); color: white; }
        .day.has-data { border-bottom: 3px solid var(--accent); }
        .dow { font-weight: bold; text-align: center; color: #7f8c8d; font-size: 0.7em; }

        /* Page Sommaire */
        .intro-page { flex: 1; overflow-y: auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .section-title { grid-column: span 2; border-bottom: 2px solid var(--accent); color: var(--primary); padding-bottom: 10px; margin-top: 20px; }
        .contact-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
        .input-box { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .summary-card { background: #f8f9fa; border-left: 5px solid var(--accent); padding: 15px; margin-top: 10px; }
        .summary-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        .total-highlight { font-size: 1.5em; color: var(--accent); font-weight: bold; }

        .content-card { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 0; }
        .drawing-viewer { flex: 1; background: #dfe6e9; border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #b2bec3; cursor: grab; }
        #mainImg { transform-origin: center; transition: transform 0.1s ease-out; user-select: none; pointer-events: none; }
        
        .img-controls { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
        .control-btn { background: white; border: 1px solid #ccc; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; font-size: 14px; }

        .upload-area { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .btn-action { background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; border: none; font-size: 0.9em; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .details-viewer { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .details-viewer h3 { grid-column: span 4; margin: 0; font-size: 1.1em; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.75em; font-weight: bold; margin-bottom: 3px; color: #636e72; }
        .input-group input { padding: 8px; border: 1px solid #dcdde1; border-radius: 6px; }

        .btn-report { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 5px; }
        .btn-print { background: #3498db; color: white; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 85%; max-height: 85%; border-radius: 15px; padding: 30px; overflow-y: auto; position: relative; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: var(--primary); color: white; }

        /* ZONE D'IMPRESSION CORRIGÉE */
        #printZone { display: none; }

        @media print {
            body > * { display: none !important; }
            #printZone { display: block !important; width: 100%; height: auto; position: relative; visibility: visible; }
            #printZone * { visibility: visible; }
            
            .print-header { border-bottom: 3px solid #27ae60; margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; }
            .print-data { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; border: 1px solid #eee; padding: 15px; border-radius: 8px; }
            .print-item { padding: 5px 0; border-bottom: 1px solid #f1f1f1; }
            .print-item b { color: #2c3e50; }
            #printZone img { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 15px; border-radius: 8px; }
        }
    </style>
</head>
<body>

<!-- Zone dédiée à l'impression (invisible sauf lors de l'impression) -->
<div id="printZone"></div>

<div class="tabs-header" id="tabsBar"></div>

<div class="main-container">
    <div class="left-panel" id="leftPanel">
        <div class="card">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">❮</button>
                <h3 id="monthYear" style="margin:0; font-size:1em;">Juin 2026</h3>
                <button onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="card" style="margin-top:auto;">
             <button class="btn-report" onclick="generateReport()">📑 Rapport Mensuel</button>
             <button style="background: #3498db; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold; width:100%; font-size:0.8em;" onclick="exportBackup()">💾 Télécharger Sauvegarde</button>
             <label style="background:#9b59b6; display:block; text-align:center; color:white; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:0.8em; margin-top:5px;">
                📂 Charger Sauvegarde
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)">
             </label>
        </div>
    </div>

    <div id="introPage" class="intro-page" style="display:none;">
        <h1 style="color:var(--primary); margin:0;">SOMMAIRE DU PROJET</h1>
        <div class="intro-grid">
            <div class="section-title">Informations Générales</div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Numéro de Projet</label>
                <input type="text" id="projectNo" placeholder="Ex: 2026-0045" class="input-box" oninput="saveIntroData()">
            </div>
            <div class="section-title">Personnes-ressources</div>
            <div style="grid-column: span 2;" id="contactsContainer">
                <script>
                    for(let i=1; i<=3; i++) {
                        document.write(`<div class="contact-row">
                            <div class="input-group"><label>Nom (${i})</label><input type="text" id="c_name_${i}" class="input-box" oninput="saveIntroData()"></div>
                            <div class="input-group"><label>Courriel</label><input type="email" id="c_mail_${i}" class="input-box" oninput="saveIntroData()"></div>
                            <div class="input-group"><label>Téléphone</label><input type="text" id="c_phone_${i}" class="input-box" oninput="saveIntroData()"></div>
                        </div>`);
                    }
                </script>
            </div>
            <div class="section-title">Avancement Global</div>
            <div style="grid-column: span 2;" class="summary-card">
                <div class="summary-item"><span>Total Pieds Carrés MDF :</span><span class="total-highlight" id="stat_total_sqft">0 p²</span></div>
                <div class="summary-item"><span>Total Heures Travail :</span><span id="stat_total_hours" style="font-weight:bold;">0 h</span></div>
                <div id="tabStats" style="margin-top:15px; font-size:0.9em;"></div>
            </div>
        </div>
    </div>

    <div id="chantierPage" class="content-card">
        <div class="drawing-viewer" id="viewport" onmousedown="startPan(event)" onwheel="handleWheel(event)">
            <span id="noImgMsg">Chargez un dessin</span>
            <img id="mainImg">
            <div class="img-controls">
                <button class="btn-delete" title="Supprimer" onclick="deleteImage()">🗑️</button>
                <button class="control-btn" onclick="zoom(1.2)">➕</button>
                <button class="control-btn" onclick="zoom(0.8)">➖</button>
                <button class="control-btn" onclick="resetZoom()">🔄</button>
            </div>
            <div class="upload-area">
                <label class="btn-action">📷 Téléverser<input type="file" id="fileInput" accept="image/*" style="display:none"></label>
            </div>
        </div>
        <div class="details-viewer">
            <h3 id="infoTitle">
                <span id="labelDate">Choisir une date</span>
                <button class="btn-print" id="btnPrintDay" style="display:none" onclick="printDailyReport()">🖨️ PDF Journée</button>
            </h3>
            <div class="input-group"><label>Travailleurs</label><input type="number" id="workers" oninput="saveData()"></div>
            <div class="input-group"><label>Heures</label><input type="number" step="0.5" id="hours" oninput="saveData()"></div>
            <div class="input-group"><label>Surface (p²)</label><input type="number" id="surface" oninput="saveData()"></div>
            <div class="input-group"><label>Note</label><input type="text" id="note" oninput="saveData()"></div>
            <div class="status" id="statusMsg" style="grid-column: span 4; text-align: right; font-size: 0.7em; color: #aaa;">Prêt</div>
        </div>
    </div>
</div>

<div id="reportModal" class="modal">
    <div class="modal-content">
        <span style="position:absolute; top:15px; right:20px; font-size:24px; cursor:pointer;" onclick="document.getElementById('reportModal').style.display='none'">&times;</span>
        <h2 id="reportTitle">Rapport Mensuel</h2>
        <div id="reportContainer"></div>
        <button class="btn-action" style="margin-top:20px;" onclick="window.print()">🖨️ Imprimer / PDF</button>
    </div>
</div>

<script>
    let activeTab = 0, activeDateStr = null, currentViewDate = new Date(2026, 5, 1);
    let db = {}, introData = {}, tabNames = ["SOMMAIRE"];
    for(let i=1; i<=15; i++) tabNames.push(`PROJET ${i}`);
    let scale = 1, posX = 0, posY = 0, isPanning = false, startX, startY;

    function loadDB() {
        const sDB = localStorage.getItem('chantierDB_V11'); if(sDB) db = JSON.parse(sDB);
        const sTabs = localStorage.getItem('chantierTabs_V11'); if(sTabs) tabNames = JSON.parse(sTabs);
        const sIntro = localStorage.getItem('chantierIntro_V11'); if(sIntro) introData = JSON.parse(sIntro);
    }
    loadDB();

    function init() {
        renderTabs();
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        renderCalendar(); updateView();
    }

    function renderTabs() {
        const bar = document.getElementById('tabsBar'); bar.innerHTML = '';
        tabNames.forEach((name, i) => {
            const wrap = document.createElement('div'); wrap.className = 'tab-wrapper';
            const btn = document.createElement('button'); 
            btn.className = `tab-btn ${i === activeTab ? 'active' : ''} ${i === 0 ? 'intro-tab' : ''}`;
            btn.innerText = name; btn.onclick = () => { activeTab = i; renderTabs(); updateView(); renderCalendar(); };
            if(i > 0) {
                const ed = document.createElement('span'); ed.className = 'edit-tab'; ed.innerHTML = '✏️';
                ed.onclick = (e) => { e.stopPropagation(); const n = prompt("Nom ?", tabNames[i]); if(n) { tabNames[i] = n.toUpperCase(); saveToLocal(); renderTabs(); updateView(); }};
                wrap.append(ed);
            }
            wrap.prepend(btn); bar.appendChild(wrap);
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        document.getElementById('monthYear').innerText = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(currentViewDate);
        ['D','L','M','M','J','V','S'].forEach(d => { const dv = document.createElement('div'); dv.className='dow'; dv.innerText=d; grid.appendChild(dv); });
        const first = new Date(year, month, 1).getDay(), total = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
        for (let d = 1; d <= total; d++) {
            const dStr = `${year}-${month+1}-${d}`;
            const dv = document.createElement('div'); 
            dv.className = 'day' + (activeDateStr === dStr ? ' selected' : '') + (db[`${activeTab}_${dStr}`] ? ' has-data' : '');
            dv.innerText = d; dv.onclick = () => { activeDateStr = dStr; renderCalendar(); updateView(); };
            grid.appendChild(dv);
        }
    }

    function changeMonth(i) { currentViewDate.setMonth(currentViewDate.getMonth() + i); renderCalendar(); }

    function updateView() {
        const introP = document.getElementById('introPage'), chantierP = document.getElementById('chantierPage'), leftP = document.getElementById('leftPanel');
        const img = document.getElementById('mainImg'), msg = document.getElementById('noImgMsg');
        const printBtn = document.getElementById('btnPrintDay');
        const labelDate = document.getElementById('labelDate');
        
        if (activeTab === 0) {
            introP.style.display = 'block'; chantierP.style.display = 'none'; leftP.style.visibility = 'hidden';
            loadIntroForm(); calculateStats();
        } else {
            introP.style.display = 'none'; chantierP.style.display = 'flex'; leftP.style.visibility = 'visible';
            if (!activeDateStr) { labelDate.innerText = "Choisir une date"; printBtn.style.display = 'none'; return; }
            resetZoom(); 
            labelDate.innerText = `${tabNames[activeTab]} - ${activeDateStr}`;
            printBtn.style.display = 'block';
            const data = db[`${activeTab}_${activeDateStr}`] || {};
            document.getElementById('workers').value = data.workers || '';
            document.getElementById('hours').value = data.hours || '';
            document.getElementById('surface').value = data.surface || '';
            document.getElementById('note').value = data.note || '';
            if (data.img) { img.src = data.img; img.style.display = 'block'; msg.style.display = 'none'; } 
            else { img.src = ''; img.style.display = 'none'; msg.style.display = 'block'; }
        }
    }

    function printDailyReport() {
        if(!activeDateStr) return;
        const data = db[`${activeTab}_${activeDateStr}`] || {};
        const pz = document.getElementById('printZone');
        const pNo = introData.projectNo || "N/A";
        
        let html = `
            <div class="print-header">
                <div>
                    <h1 style="margin:0; font-size:24px;">RAPPORT DE CHANTIER JOURNALIER</h1>
                    <p style="margin:5px 0; font-size:16px;"><b>PROJET :</b> ${tabNames[activeTab]} | <b>DOSSIER :</b> ${pNo}</p>
                </div>
                <div style="text-align:right">
                    <h2 style="margin:0; color:#27ae60;">${activeDateStr}</h2>
                </div>
            </div>
            
            <div class="print-data">
                <div class="print-item"><b>Nombre de travailleurs :</b> ${data.workers || 0}</div>
                <div class="print-item"><b>Heures travaillées :</b> ${data.hours || 0} h</div>
                <div class="print-item"><b>Surface MDF posée :</b> ${data.surface || 0} p²</div>
                <div class="print-item"><b>Notes :</b> ${data.note || 'Aucune note particulière'}</div>
            </div>
        `;
        
        if(data.img) {
            html += `<div style="margin-top:10px;"><h3>Dessin / Photo de la journée :</h3><img src="${data.img}"></div>`;
        } else {
            html += `<div style="margin-top:20px; border:1px dashed #ccc; padding:40px; text-align:center; color:#999;">Aucune image jointe pour cette journée</div>`;
        }
        
        pz.innerHTML = html;
        window.print();
    }

    function saveIntroData() {
        introData.projectNo = document.getElementById('projectNo').value;
        introData.contacts = [];
        for(let i=1; i<=3; i++) {
            introData.contacts.push({
                name: document.getElementById(`c_name_${i}`).value,
                mail: document.getElementById(`c_mail_${i}`).value,
                phone: document.getElementById(`c_phone_${i}`).value
            });
        }
        saveToLocal();
    }

    function loadIntroForm() {
        document.getElementById('projectNo').value = introData.projectNo || "";
        if(introData.contacts) {
            introData.contacts.forEach((c, i) => {
                const idx = i+1;
                document.getElementById(`c_name_${idx}`).value = c.name || "";
                document.getElementById(`c_mail_${idx}`).value = c.mail || "";
                document.getElementById(`c_phone_${idx}`).value = c.phone || "";
            });
        }
    }

    function calculateStats() {
        let tS = 0, tH = 0, perT = {};
        Object.keys(db).forEach(k => {
            const data = db[k], tabIdx = k.split('_')[0];
            if(tabIdx == 0) return;
            const sq = parseFloat(data.surface || 0), hr = parseFloat(data.hours || 0);
            tS += sq; tH += hr;
            if(sq > 0 || hr > 0) perT[tabIdx] = (perT[tabIdx] || 0) + sq;
        });
        document.getElementById('stat_total_sqft').innerText = `${tS.toLocaleString()} p²`;
        document.getElementById('stat_total_hours').innerText = `${tH.toLocaleString()} h`;
        let tabHtml = "<strong>Détails par projet :</strong><br>";
        for(let i=1; i<tabNames.length; i++) { if(perT[i]) tabHtml += `• ${tabNames[i]} : ${perT[i].toLocaleString()} p²<br>`; }
        document.getElementById('tabStats').innerHTML = tabHtml;
    }

    function handleFileUpload(e) {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = ev => { db[`${activeTab}_${activeDateStr}`] = db[`${activeTab}_${activeDateStr}`] || {}; db[`${activeTab}_${activeDateStr}`].img = ev.target.result; saveToLocal(); updateView(); renderCalendar(); e.target.value=""; };
        reader.readAsDataURL(f);
    }
    function deleteImage() { if(!confirm("Supprimer l'image ?")) return; db[`${activeTab}_${activeDateStr}`].img = ""; saveToLocal(); updateView(); renderCalendar(); }
    function saveData() {
        const k = `${activeTab}_${activeDateStr}`; db[k] = db[k] || { img: '' };
        db[k].workers = document.getElementById('workers').value;
        db[k].hours = document.getElementById('hours').value;
        db[k].surface = document.getElementById('surface').value;
        db[k].note = document.getElementById('note').value;
        saveToLocal(); document.getElementById('statusMsg').innerText = "Sauvegardé " + new Date().toLocaleTimeString();
        renderCalendar();
    }
    function saveToLocal() { 
        localStorage.setItem('chantierDB_V11', JSON.stringify(db)); 
        localStorage.setItem('chantierTabs_V11', JSON.stringify(tabNames)); 
        localStorage.setItem('chantierIntro_V11', JSON.stringify(introData)); 
    }
    function exportBackup() { const bl = new Blob([JSON.stringify({db, tabs:tabNames, intro:introData})], {type:'application/json'}); const a = document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=`BACKUP_CHANTIER_FINAL.json`; a.click(); }
    function importBackup(inp) { if(!inp.files[0]) return; const r = new FileReader(); r.onload = e => { const im = JSON.parse(e.target.result); db=im.db; tabNames=im.tabs; introData=im.intro||{}; saveToLocal(); location.reload(); }; r.readAsText(inp.files[0]); }
    
    function generateReport() {
        const monthTxt = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(currentViewDate);
        document.getElementById('reportTitle').innerText = `Rapport Mensuel : ${tabNames[activeTab]}`;
        const container = document.getElementById('reportContainer');
        const pz = document.getElementById('printZone'); // On prépare aussi le printZone
        
        let header = `<h2>Rapport Mensuel : ${tabNames[activeTab]} - ${monthTxt}</h2>`;
        let html = `<table><thead><tr><th>Date</th><th>Travailleurs</th><th>Heures</th><th>Surface (p²)</th><th>Notes</th></tr></thead><tbody>`;
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        let sW=0, sH=0, sS=0;
        for (let d = 1; d <= totalDays; d++) {
            const key = `${activeTab}_${year}-${month+1}-${d}`;
            const data = db[key];
            if (data && (data.workers || data.hours || data.surface)) {
                const w=parseFloat(data.workers||0), h=parseFloat(data.hours||0), s=parseFloat(data.surface||0);
                html += `<tr><td>${d} ${monthTxt}</td><td>${w}</td><td>${h}</td><td>${s}</td><td>${data.note || ''}</td></tr>`; sW+=w; sH+=h; sS+=s;
            }
        }
        html += `<tr style="font-weight:bold; background:#eee;"><td>TOTAL</td><td>${sW}</td><td>${sH}</td><td>${sS}</td><td>-</td></tr></tbody></table>`;
        
        container.innerHTML = html;
        pz.innerHTML = header + html; // Pour l'impression
        document.getElementById('reportModal').style.display = 'flex';
    }

    function zoom(d) { scale = Math.min(Math.max(0.1, scale * d), 10); applyTransform(); }
    function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(); }
    function applyTransform() { document.getElementById('mainImg').style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
    function startPan(e) { if(!activeDateStr) return; isPanning = true; startX = e.clientX-posX; startY = e.clientY-posY; window.onmousemove=pan; window.onmouseup=endPan; }
    function pan(e) { if(!isPanning) return; posX=e.clientX-startX; posY=e.clientY-startY; applyTransform(); }
    function endPan() { isPanning=false; window.onmousemove=null; window.onmouseup=null; }
    function handleWheel(e) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }

    init();
</script>
</body>
</html>
